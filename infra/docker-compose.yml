services:
  neo4j:
    image: neo4j:5.26-community
    container_name: trustbank-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_BIND:-127.0.0.1}:7474:7474"
      - "${NEO4J_BIND:-127.0.0.1}:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${TRUSTBANK_NEO4J_PASSWORD:-trustbank-local-pw}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  neo4j_data:
